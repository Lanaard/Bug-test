<!doctype html>
<meta charset="utf-8">
<title>postMessage test</title>
<input id="target" placeholder="Bookings admin URL" size="60">
<button onclick="openTarget()">1. Open Bookings</button>
<button onclick="sendFake()">2. Send fake success</button>
<script>
  var bookingsWindow = null;
  function openTarget() {
    bookingsWindow = window.open(document.getElementById("target").value, "_blank");
  }
  function sendFake() {
    if (bookingsWindow) {
      bookingsWindow.postMessage(JSON.stringify({status: true}), "*");
    }
  }
</script>
